name: Secret Value Test

on:
  workflow_dispatch:

jobs:
  test-secrets:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        secret_name: [MY_SECRETS_DEV, MY_SECRETS_PROD]

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Test secret value
        run: |
          # Get the secret value from the matrix
          SECRET="${{ secrets[matrix.secret_name] }}"

          # Check the value
          if [ "$SECRET" = "dev" ]; then
            echo "1"
            echo "heh"
          elif [ "$SECRET" = "prod" ]; then
            echo "2"
            echo "no"
            echo "nope"
          else
            echo "Unknown secret value"
          fi
